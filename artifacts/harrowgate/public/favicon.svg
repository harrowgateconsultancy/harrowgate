<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a96e"/>
      <stop offset="100%" stop-color="#8a7040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0b2213"/>

  <!-- Border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#a28959" stroke-width="0.8" opacity="0.55"/>

  <!-- Pillar capital (top entablature) -->
  <rect x="5" y="6" width="22" height="2" rx="0.4" fill="url(#gold)"/>

  <!-- Three columns -->
  <rect x="6.5"  y="9" width="3.5" height="13" rx="0.4" fill="url(#gold)"/>
  <rect x="14.25" y="9" width="3.5" height="13" rx="0.4" fill="url(#gold)"/>
  <rect x="22"   y="9" width="3.5" height="13" rx="0.4" fill="url(#gold)"/>

  <!-- Pillar base (stylobate — two steps) -->
  <rect x="5"   y="22"   width="22" height="2"   rx="0.4" fill="url(#gold)"/>
  <rect x="4"   y="24.2" width="24" height="1.8" rx="0.4" fill="url(#gold)" opacity="0.6"/>
</svg>

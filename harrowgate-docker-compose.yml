version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: harrowgate
      POSTGRES_USER: harrowgate
      POSTGRES_PASSWORD: "Hawwa@2809"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harrowgate -d harrowgate"]

version: "3.9"

services:

  # ── PostgreSQL database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: harrowgate
      POSTGRES_USER: harrowgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harrowgate -d harrowgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── HARROWGATE app (API + serves built frontend) ────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgres://harrowgate:${POSTGRES_PASSWORD}@postgres:5432/harrowgate"
      STUDENT_JWT_SECRET: ${STUDENT_JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      # If you have a custom domain for Google OAuth redirect (optional):
      # GOOGLE_REDIRECT_URI: https://yourdomain.com/api/student/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy

  # ── Nginx reverse proxy (optional — for HTTPS / custom domain) ──────────────
  # Comment out this block if you manage TLS elsewhere (e.g. Ugreen's built-in
  # reverse proxy or Cloudflare Tunnel).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro        # Place your SSL certs here
    depends_on:
      - app
    profiles:
      - with-nginx    # Only starts when you run: docker-compose --profile with-nginx up

volumes:
  postgres_data:
